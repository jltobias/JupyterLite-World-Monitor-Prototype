name: Build and Deploy Field Guide

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check data contracts and scientific calculations
        run: python -m pytest -q

      - name: Execute notebooks and build Book plus JupyterLite
        run: python scripts/build_site.py

      - name: Setup Node for WebAssembly verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute every lab in the JupyterLite Python runtime
        run: |
          npm install --prefix _build/wasm --no-audit --no-fund pyodide@314.0.0
          node scripts/check_pyodide.mjs

      - name: Verify JupyterLite startup configuration
        run: node scripts/check_lite_bootstrap.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
