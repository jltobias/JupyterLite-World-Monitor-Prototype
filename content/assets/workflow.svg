<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img"><title>Observe, verify, analyze, brief, review</title><g font-family="Segoe UI,Arial,sans-serif"><rect x="20" y="30" width="215" height="110" rx="12" fill="#123b4b"/><text x="38" y="70" font-size="18" fill="#7ee0d1">01 / OBSERVE</text><text x="38" y="108" font-size="16" fill="#ffffff">Signals + source</text><text x="238" y="92" fill="#007f86" font-size="23">→</text><rect x="255" y="30" width="215" height="110" rx="12" fill="#123b4b"/><text x="273" y="70" font-size="18" fill="#7ee0d1">02 / VERIFY</text><text x="273" y="108" font-size="16" fill="#ffffff">Time + coverage</text><text x="473" y="92" fill="#007f86" font-size="23">→</text><rect x="490" y="30" width="215" height="110" rx="12" fill="#123b4b"/><text x="508" y="70" font-size="18" fill="#7ee0d1">03 / ANALYZE</text><text x="508" y="108" font-size="16" fill="#ffffff">Maps + methods</text><text x="708" y="92" fill="#007f86" font-size="23">→</text><rect x="725" y="30" width="215" height="110" rx="12" fill="#123b4b"/><text x="743" y="70" font-size="18" fill="#7ee0d1">04 / BRIEF</text><text x="743" y="108" font-size="16" fill="#ffffff">Claim + uncertainty</text><text x="943" y="92" fill="#007f86" font-size="23">→</text><rect x="960" y="30" width="215" height="110" rx="12" fill="#123b4b"/><text x="978" y="70" font-size="18" fill="#7ee0d1">05 / REVIEW</text><text x="978" y="108" font-size="16" fill="#ffffff">Owner + next step</text></g></svg>